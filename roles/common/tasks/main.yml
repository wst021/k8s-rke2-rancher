---
- name: 设置主机名
  ansible.builtin.hostname:
    name: "{{ node_name }}"
    use: systemd

- name: 写入 hosts 解析
  ansible.builtin.copy:
    dest: /etc/hosts
    content: |
      127.0.0.1   localhost
      192.168.230.140 k8smaster
      192.168.230.141 k8snode1
      192.168.230.142 k8snode2
    mode: '0644'

- name: 关闭 swap
  ansible.builtin.shell: |
    swapoff -a
    sed -ri 's@^(/.*swap.*)@#\1@' /etc/fstab
  changed_when: false

- name: 加载内核模块
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
      ip_vs
      ip_vs_rr
      nf_conntrack
    mode: '0644'
  register: modules_conf

- name: 立即加载内核模块
  ansible.builtin.shell: |
    modprobe overlay
    modprobe br_netfilter
    modprobe ip_vs || true
    modprobe ip_vs_rr || true
    modprobe nf_conntrack || true
  changed_when: false

- name: 配置内核参数
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      net.core.somaxconn                  = 32768
      net.netfilter.nf_conntrack_max      = 1048576
      fs.inotify.max_user_instances       = 8192
      fs.inotify.max_user_watches         = 1048576
      vm.swappiness                       = 0
      vm.max_map_count                    = 262144
    mode: '0644'
  notify: reload_sysctl

- name: 关闭 firewalld（测试环境从简）
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when: enable_firewalld_disable | bool
  failed_when: false

- name: 设置 SELinux 为 permissive
  ansible.builtin.shell: |
    setenforce 0 2>/dev/null || true
    sed -ri 's@^SELINUX=enforcing@SELINUX=permissive@' /etc/selinux/config
  when: enable_selinux_disable | bool
  changed_when: false

- name: 安装基础依赖
  ansible.builtin.dnf:
    name:
      - curl
      - wget
      - jq
      - socat
      - conntrack
      - ipset
      - iptables
      - nfs-utils
      - iscsi-initiator-utils
      - lsof
      - vim
      - tar
      - bash-completion
      - chrony
    state: present

- name: 启动 iscsid（Longhorn 依赖）
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true
  failed_when: false

- name: 启动 chronyd 并同步时间
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true

- name: 创建数据目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /var/lib/rancher
    - /var/lib/kubelet
    - /var/lib/longhorn
    - /etc/rancher/rke2

